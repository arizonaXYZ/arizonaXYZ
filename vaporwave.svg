<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="0.6" stop-color="#2b0b4f"/>
      <stop offset="1" stop-color="#7a1c7c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0433"/>
      <stop offset="1" stop-color="#05010f"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.5" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <!-- Franjas del sol -->
    <mask id="sunStripes">
      <rect x="0" y="0" width="800" height="260" fill="#fff"/>
      <rect x="300" y="122" width="200" height="3" fill="#000"/>
      <rect x="300" y="134" width="200" height="5" fill="#000"/>
      <rect x="300" y="147" width="200" height="7" fill="#000"/>
      <rect x="300" y="160" width="200" height="10" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="800" height="170"/></clipPath>
    <clipPath id="belowHorizon"><rect x="0" y="170" width="800" height="90"/></clipPath>
    <!-- Degradado animado del nombre -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff71ce"/>
      <stop offset="0.33" stop-color="#01cdfe"/>
      <stop offset="0.66" stop-color="#b967ff"/>
      <stop offset="1" stop-color="#ff71ce"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name { font-family: "Arial Black", Impact, "Helvetica Neue", sans-serif; font-size: 76px; font-weight: 900; letter-spacing: 14px; }
      .sub { font-family: "Courier New", monospace; font-size: 15px; letter-spacing: 6px; fill: #01cdfe; }
      .ghostA { fill: #01cdfe; opacity: .7; animation: glitchA 3.5s infinite steps(1); }
      .ghostB { fill: #ff2975; opacity: .7; animation: glitchB 3.5s infinite steps(1); }
      .sunWrap { animation: pulse 4s ease-in-out infinite; transform-origin: 400px 170px; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      @keyframes glitchA { 0%,86%,100% { transform: translate(-2px,0) } 88% { transform: translate(-8px,2px) } 92% { transform: translate(5px,-2px) } 95% { transform: translate(-4px,0) } }
      @keyframes glitchB { 0%,86%,100% { transform: translate(2px,0) } 88% { transform: translate(8px,-2px) } 92% { transform: translate(-5px,2px) } 95% { transform: translate(4px,0) } }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.04) } }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    </style>
  </defs>

  <!-- Cielo -->
  <rect width="800" height="260" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#fff">
    <circle class="star" cx="80" cy="30" r="1.5"/>
    <circle class="star" cx="170" cy="70" r="1" style="animation-delay:-1s"/>
    <circle class="star" cx="260" cy="25" r="1.2" style="animation-delay:-2s"/>
    <circle class="star" cx="560" cy="35" r="1.5" style="animation-delay:-.5s"/>
    <circle class="star" cx="650" cy="80" r="1" style="animation-delay:-1.5s"/>
    <circle class="star" cx="730" cy="22" r="1.3" style="animation-delay:-2.5s"/>
    <circle class="star" cx="40" cy="110" r="1" style="animation-delay:-.8s"/>
    <circle class="star" cx="760" cy="120" r="1" style="animation-delay:-1.8s"/>
  </g>

  <!-- Sol -->
  <g clip-path="url(#aboveHorizon)">
    <g class="sunWrap">
      <circle cx="400" cy="170" r="95" fill="url(#sun)" mask="url(#sunStripes)"/>
    </g>
  </g>

  <!-- Suelo + cuadrícula -->
  <rect x="0" y="170" width="800" height="90" fill="url(#ground)"/>
  <g clip-path="url(#belowHorizon)" stroke="#ff2bd6" stroke-width="1.5" opacity=".85">
    <!-- líneas que convergen al horizonte -->
    <line x1="400" y1="170" x2="-800" y2="260"/><line x1="400" y1="170" x2="-600" y2="260"/>
    <line x1="400" y1="170" x2="-400" y2="260"/><line x1="400" y1="170" x2="-200" y2="260"/>
    <line x1="400" y1="170" x2="0" y2="260"/><line x1="400" y1="170" x2="100" y2="260"/>
    <line x1="400" y1="170" x2="200" y2="260"/><line x1="400" y1="170" x2="300" y2="260"/>
    <line x1="400" y1="170" x2="400" y2="260"/><line x1="400" y1="170" x2="500" y2="260"/>
    <line x1="400" y1="170" x2="600" y2="260"/><line x1="400" y1="170" x2="700" y2="260"/>
    <line x1="400" y1="170" x2="800" y2="260"/><line x1="400" y1="170" x2="1000" y2="260"/>
    <line x1="400" y1="170" x2="1200" y2="260"/><line x1="400" y1="170" x2="1400" y2="260"/>
    <line x1="400" y1="170" x2="1600" y2="260"/>
    <!-- líneas horizontales que avanzan hacia ti -->
    <g id="hlines">
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
      <line x1="0" x2="800" y1="170" y2="170">
        <animate attributeName="y1" values="170;262" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
        <animate attributeName="y2" values="170;262" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.6 0 1 1"/>
      </line>
    </g>
  </g>
  <!-- Brillo del horizonte -->
  <rect x="0" y="168" width="800" height="3" fill="#ff71ce" filter="url(#glow)"/>

  <!-- Subtítulo -->
  <text x="400" y="42" text-anchor="middle" class="sub">web design / game dev</text>

  <!-- Nombre con glitch cromático -->
  <text x="400" y="128" text-anchor="middle" class="name ghostA">ARIZONA</text>
  <text x="400" y="128" text-anchor="middle" class="name ghostB">ARIZONA</text>
  <text x="400" y="128" text-anchor="middle" class="name" fill="url(#nameGrad)" filter="url(#glow)">ARIZONA</text>
</svg>
